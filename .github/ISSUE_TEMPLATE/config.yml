    url: https://github.com/sl0wz3r/dupearr/discussions/categories/q-a
    about: How do I…? Is this result expected? Ask in Discussions → Q&A.
  - name: Idea or roadmap discussion
    url: https://github.com/sl0wz3r/dupearr/discussions/categories/ideas
    about: Open-ended ideas and larger proposals. See ROADMAP.md first.
  - name: Security vulnerability
    url: https://github.com/sl0wz3r/dupearr/security/policy
    about: Please do not open a public issue. Report it privately as the security policy describes.
