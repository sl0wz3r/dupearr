name: Feature request
description: Suggest a specific, well-defined change or addition.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Before you write it up:

        - Check the [roadmap](https://github.com/sl0wz3r/dupearr/blob/main/ROADMAP.md). If your idea is on it, add your use case to that item's issue (label `roadmap`) rather than opening a new one.
        - Open-ended ideas, and anything large (a new media server, a new kind of detection), are best discussed first in [Discussions → Ideas](https://github.com/sl0wz3r/dupearr/discussions/categories/ideas).
        - Dupearr deletes media, so every feature has to fail safe. The [safety guide](https://github.com/sl0wz3r/dupearr/blob/main/docs/user/safety.md) lists what Dupearr will never do.

        Please do not post API keys, tokens, passwords or private paths.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detection and grouping
        - Decision profiles and criteria
        - Removal, recycle bin and safety guards
        - Integrations (media servers, Radarr/Sonarr, other apps)
        - Web UI
        - Notifications and webhooks
        - API
        - Packaging (Docker, Unraid, native)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your situation and what gets in your way today. Real examples help most, e.g. "a 4K remux and a 1080p WEB-DL of the same movie in two libraries, and …".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Dupearr to do?
      description: How it could work from your point of view (settings, UI, behaviour).
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: What could go wrong?
      description: >-
        Could this make Dupearr remove, move or keep the wrong copy? What should it do when data is
        missing, stale or ambiguous? If you are not sure, say so: that is useful too.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you do today, or other tools that solve this.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to help build this (see CONTRIBUTING.md).
