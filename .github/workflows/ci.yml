# CI on GitHub. Every branch push and pull request: web UI (typecheck, tests, build), Go (gofmt,
# vet, race tests, build, end-to-end suite, govulncheck), npm audit, and the Docker image (build +
# docker/test-image.sh, no push). Releases: release.yml, on tags. Actions are pinned to full commit
# SHAs (the comment names the release; Renovate, .github/renovate.json, bumps both). The token is
# read-only and never persisted.
name: ci

on:
  push:
    # Branches only: releases are built from tags by release.yml.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or pull request: a newer push cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Latest 1.27.x patch, like the Dockerfile's golang:1.27-alpine. go-version-file would install
      # exactly go.mod's "go 1.27.0" (no security fixes). Keep in step with go.mod and the
      # Dockerfile's golang image.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web - install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Web - typecheck
        working-directory: web
        run: npm run typecheck

      - name: Web - test
        working-directory: web
        run: npm test

      # The Go binary embeds web/dist (go:embed), so build the UI before the Go steps.
      - name: Web - build
        working-directory: web
        run: npm run build

      - name: Go - gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go - vet
        run: go vet ./...

      # -race needs cgo (and gcc); release builds use CGO_ENABLED=0.
      - name: Go - test (race)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Go - build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o bin/dupearr ./cmd/dupearr && ./bin/dupearr version

      # Black-box end-to-end suite (internal/e2e, build tag "e2e"; same as `make e2e`): the real
      # binary, race-built so a data race fails the run, configured and driven through its HTTP
      # API against the in-process fake Plex/Radarr/Sonarr (loopback only).
      - name: Go - end-to-end
        env:
          CGO_ENABLED: "1"
          DUPEARR_E2E_RACE: "1"
        run: go test -tags e2e -count=1 -timeout 15m ./internal/e2e/...

      # Known vulnerabilities that the code can reach (govulncheck fails only on those) in the Go
      # dependencies and standard library, and in the web UI's runtime dependencies.
      - name: Go - govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Web - npm audit (runtime dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The runner's own platform, loaded into its Docker daemon for the tests below (not pushed).
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: dupearr:ci
          provenance: false
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}

      # Entrypoint (PUID/PGID/UMASK/TZ, /config ownership and lock, never /data), exec wrapper,
      # SIGTERM, and the real server: HEALTHCHECK, web UI, in-place restart, clean stop.
      # Uses named volumes and docker cp only, so it works against the runner host's daemon.
      - name: Test image
        run: sh docker/test-image.sh dupearr:ci

      # The Dockerfile pins its golang image by digest: warn when a newer Go patch release (with
      # standard library fixes) is out, so the digest gets bumped. The release workflow refuses it.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false

      - name: Check the image's Go version
        run: sh docker/check-go-version.sh --warn dupearr:ci
