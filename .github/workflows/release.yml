# Release on tags v* in the public GitHub repository: test, push the multi-arch image to
# ghcr.io/<owner>/dupearr, attest (and optionally sign) it, publish a GitHub release with the
# native binaries, and push the one-command demo's image of FAKE Plex/Radarr/Sonarr servers
# (docker/fakemedia.Dockerfile, deploy/demo) to ghcr.io/<owner>/dupearr-demo-media with the same tags.
#
# Nothing to configure for a first release. The image is pushed with the workflow's own
# GITHUB_TOKEN (packages: write, image job only) to ghcr.io/<repository owner, lower-case>/dupearr,
# which must match the image in unraid/ca/publish.env (REGISTRY, IMAGE_NAME) and <Repository> in
# the Unraid template. After the FIRST push, make the package public by hand (package page ->
# Package settings -> Change visibility): a new ghcr.io package is private, does not inherit the
# repository's visibility, and Unraid needs an anonymous pull. Public cannot be undone. The same
# goes for the dupearr-demo-media package after its first push: deploy/demo pulls it anonymously.
#
# Repository variable (Settings -> Secrets and variables -> Actions -> Variables), optional:
#   COSIGN_SIGN  "true": also sign the image with cosign, keyless (Sigstore, GitHub OIDC). The
#                signature, the certificate and this repository's identity are recorded in the
#                public Rekor transparency log.
#
# Tags: vX.Y.Z pushes :X.Y.Z, :vX.Y.Z, :X.Y and :latest. A pre-release tag (vX.Y.Z-rc.1) pushes only
# :X.Y.Z-rc.1 and :vX.Y.Z-rc.1 and is published as a GitHub pre-release, so :latest and :X.Y never
# point at a pre-release. Any other v* tag fails the "Check the tag" step before anything is built
# (git allows characters such as $ ( ) ; in tag names, and the version ends up in command lines).
#
# Supply chain: every action is pinned to a full commit SHA (the comment names its release;
# Renovate, .github/renovate.json, bumps both); the Dockerfile pins its base images by digest; the
# test job gates on govulncheck and npm audit; the image is tested before it is pushed; the pushed
# image carries BuildKit SBOM and SLSA provenance (mode=max) attestations; and GitHub artifact
# attestations (Sigstore) cover the image digest and every release asset:
#   gh attestation verify oci://ghcr.io/<owner>/dupearr:X.Y.Z --owner <owner>
#   gh attestation verify dupearr_X.Y.Z_linux_amd64.tar.gz --owner <owner>
# The release notes name the image digest, so users can pin exactly this image (IMAGE:X.Y.Z@sha256:...).
#
# SBOMs: the release also carries software bills of materials, SPDX 2.3 and CycloneDX 1.6 JSON, made
# by Syft (the sbom job): dupearr_X.Y.Z_source.{spdx,cdx}.json for the tagged source (Go modules
# from go.mod/go.sum, the web UI's runtime npm packages from web/package-lock.json, the workflows'
# actions) and dupearr_X.Y.Z_image_linux_{amd64,arm64}.{spdx,cdx}.json for each platform of the
# pushed image, by digest (the alpine packages and the Go modules compiled into the binary). They
# are listed in checksums.txt, so the archives' attestation covers them as well
# (gh attestation verify dupearr_X.Y.Z_source.spdx.json --owner <owner>). No separate SBOM
# attestation on the image: BuildKit's SBOM attestation is part of the image index, whose digest the
# image's provenance attestation already covers.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: dupearr

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the tag
        run: |
          set -eu
          if ! printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '${GITHUB_REF_NAME}' is not a release version (vX.Y.Z or vX.Y.Z-pre.N)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Latest 1.27.x patch (the binaries ship to users), like the Dockerfile's golang:1.27-alpine.
      # go-version-file would install exactly go.mod's "go 1.27.0". Keep in step with go.mod.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web - install, typecheck, test, build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      # Same gates as ci.yml: the tag's commit is not necessarily one that ci.yml tested.
      - name: Go - gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go - vet
        run: go vet ./...

      - name: Go - test (race)
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      # Black-box end-to-end suite (real binary, race-built, against the fake Plex/Radarr/Sonarr).
      - name: Go - end-to-end
        env:
          CGO_ENABLED: "1"
          DUPEARR_E2E_RACE: "1"
        run: go test -tags e2e -count=1 -timeout 15m ./internal/e2e/...

      # Known vulnerabilities that the code can reach (govulncheck fails only on those) in the Go
      # dependencies and standard library, and in the web UI's runtime dependencies.
      - name: Go - govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Web - npm audit (runtime dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate

  image:
    name: container image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Push to ghcr.io with GITHUB_TOKEN, and the attestation next to the image.
      packages: write
      # Sigstore certificate (OIDC) for the attestation and the optional cosign signature.
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute version, image and tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '$tag' is not a release version (vX.Y.Z or vX.Y.Z-pre.N)" >&2
            exit 1
          fi
          # Image references must be lower-case (the GitHub owner may not be).
          version="$(printf '%s' "${tag#v}" | tr '[:upper:]' '[:lower:]')"
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${IMAGE_NAME}"
          tags="${image}:${version},${image}:v${version}"
          case "$version" in
            *-*) echo "Pre-release: not moving :latest or :X.Y" ;;
            *) tags="${tags},${image}:${version%.*},${image}:latest" ;;
          esac
          {
            echo "version=${version}"
            echo "image=${image}"
            echo "tags=${tags}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "docs=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${tag}/README.md"
          } >> "$GITHUB_OUTPUT"
          echo "Will push: ${tags}"

      # Only the final alpine stage runs per architecture (apk add); Go and Node cross-compile.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Test the image for the runner's platform (linux/amd64, what Unraid runs) before anything is
      # pushed: the tag's commit is not necessarily one that ci.yml tested. The push reuses its cache.
      - name: Build image for the tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: dupearr:release-test
          provenance: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            SOURCE_URL=${{ steps.meta.outputs.source }}
            DOCS_URL=${{ steps.meta.outputs.docs }}

      - name: Test image
        run: sh docker/test-image.sh dupearr:release-test

      # The Dockerfile's golang image is pinned by digest, so the standard library compiled into the
      # binary only gets security fixes when that digest is bumped: never publish an image built
      # with an older Go patch release than the latest one.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false

      - name: Check the image's Go version
        run: sh docker/check-go-version.sh dupearr:release-test

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SBOM (SPDX) and SLSA provenance (mode=max) are attached to the image index as attestation
      # manifests (platform unknown/unknown). Docker 20.10+ and Unraid's update check (it accepts OCI
      # indexes and compares the index digest) ignore them when pulling. The index annotations give
      # ghcr.io the description and repository link for a multi-arch image.
      - name: Build and push linux/amd64 + linux/arm64
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: |
            index:org.opencontainers.image.source=${{ steps.meta.outputs.source }}
            index:org.opencontainers.image.licenses=GPL-3.0-or-later
            index:org.opencontainers.image.description=Finds duplicate movies and TV episodes in Plex and safely removes the copies you do not need (Radarr/Sonarr aware, dry run by default).
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            SOURCE_URL=${{ steps.meta.outputs.source }}
            DOCS_URL=${{ steps.meta.outputs.docs }}

      # Unraid is x86-64: refuse a release whose index lacks linux/amd64 (or linux/arm64).
      - name: Check the pushed image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "The push reported no image digest ('$DIGEST')" >&2; exit 1 ;;
          esac
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" > index.json
          platforms="$(jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"' index.json | sort -u | tr '\n' ' ')"
          echo "Platforms: ${platforms}"
          for want in linux/amd64 linux/arm64; do
            case " ${platforms} " in
              *" ${want} "*) ;;
              *) echo "The pushed index has no ${want} image" >&2; exit 1 ;;
            esac
          done
          echo "Pushed ${IMAGE}:${VERSION}@${DIGEST}"
          echo "Image: \`${IMAGE}:${VERSION}@${DIGEST}\` (${platforms})" >> "$GITHUB_STEP_SUMMARY"

      # Build provenance signed with a Sigstore certificate for this workflow, stored in GitHub's
      # attestation store and pushed next to the image (OCI referrer). Storage records only exist for
      # organisation-owned repositories.
      - name: Attest the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Install cosign
        if: vars.COSIGN_SIGN == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: vars.COSIGN_SIGN == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  sbom:
    name: SBOMs
    # After the image: the image SBOMs describe the digest that was pushed.
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Read the image just pushed (its package may still be private). Nothing is written here: the
      # binaries job publishes the files with the release.
      packages: read
    steps:
      # The version ends up in file names and command lines below: validate it here too.
      - name: Check the tag
        run: |
          set -eu
          if ! printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '${GITHUB_REF_NAME}' is not a release version (vX.Y.Z or vX.Y.Z-pre.N)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Syft, the generator behind BuildKit's in-image SBOM as well. The action installs the Syft
      # release its own commit pins, through Syft's installer, which checks the download against the
      # release's checksums; Renovate bumps the action (and with it Syft).
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # On the fresh checkout, before anything is installed or built: the Go modules of go.mod/go.sum,
      # the web UI's runtime npm packages from web/package-lock.json (what the embedded UI bundles;
      # its build tooling is left out, as in the npm audit --omit=dev gate) and the actions the
      # workflows use. Explicit format versions, so a Syft update cannot change them unannounced.
      - name: Source SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          out="${RUNNER_TEMP}/sbom"
          mkdir -p "$out"
          "$SYFT" scan dir:. --source-name dupearr --source-version "$version" \
            -o "spdx-json@2.3=${out}/dupearr_${version}_source.spdx.json" \
            -o "cyclonedx-json@1.6=${out}/dupearr_${version}_source.cdx.json"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One SBOM per platform of the pushed index, read from the registry by digest (nothing is run):
      # the alpine packages and the Go modules compiled into /app/dupearr (from its build info). The
      # web UI's npm packages are inside the binary, where no scanner can see them: the source SBOM
      # lists them.
      - name: Image SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "The image job reported no image digest ('$DIGEST')" >&2; exit 1 ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          out="${RUNNER_TEMP}/sbom"
          for platform in linux/amd64 linux/arm64; do
            name="dupearr_${version}_image_$(printf '%s' "$platform" | tr / _)"
            "$SYFT" scan "registry:${IMAGE}@${DIGEST}" --platform "$platform" --source-version "$version" \
              -o "spdx-json@2.3=${out}/${name}.spdx.json" \
              -o "cyclonedx-json@1.6=${out}/${name}.cdx.json"
          done

      # Refuse an empty or partial SBOM (a cataloger that silently found nothing): each file must list
      # a Go module, an npm package (source) or an alpine package (image) that the release contains.
      - name: Check the SBOMs
        run: |
          set -eu
          cd "${RUNNER_TEMP}/sbom"
          lists() {
            file=$1
            shift
            case "$file" in
              *.spdx.json) items=.packages ;;
              *) items=.components ;;
            esac
            for name in "$@"; do
              if ! jq -e --arg n "$name" "any(${items}[]?; .name == \$n)" "$file" > /dev/null; then
                echo "$file does not list $name" >&2
                exit 1
              fi
            done
          }
          version="${GITHUB_REF_NAME#v}"
          for format in spdx cdx; do
            lists "dupearr_${version}_source.${format}.json" modernc.org/sqlite golang.org/x/crypto react
            for arch in amd64 arm64; do
              lists "dupearr_${version}_image_linux_${arch}.${format}.json" modernc.org/sqlite stdlib tini
            done
          done
          ls -l

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          # Only a hand-over to the binaries job (and its re-runs): the release keeps the files.
          retention-days: 7

  binaries:
    name: release binaries
    # After the image (the release notes name its digest) and the SBOMs (release assets).
    needs: [test, image, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Create the GitHub release and upload its assets.
      contents: write
      id-token: write
      attestations: write
    steps:
      # The version is interpolated into make/shell command lines below: validate it here too.
      - name: Check the tag
        run: |
          set -eu
          if ! printf '%s\n' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '${GITHUB_REF_NAME}' is not a release version (vX.Y.Z or vX.Y.Z-pre.N)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same toolchain as the test job: the latest 1.27.x patch, not go.mod's exact 1.27.0.
      # No Go/npm caches in this job: it builds the published archives, and a restored cache is
      # content this run did not verify (cache poisoning). Modules are checked against go.sum and
      # package-lock.json either way; the job only gets slower.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: false

      # package-manager-cache: false keeps it that way (setup-node v5+ caches on its own when a
      # package.json names a packageManager).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install zip (Windows archives)
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zip
          fi

      - name: Build web UI and cross-compile archives
        run: |
          set -eu
          make web
          make release VERSION="${GITHUB_REF_NAME#v}" COMMIT="$(git rev-parse --short HEAD)"
          cat dist/checksums.txt

      # The sbom job's files, from this run (the download checks the artifact's digest), next to the
      # archives. make release starts from an empty dist/, so this comes after it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist

      # checksums.txt lists the SBOMs as well, so the attestation below covers them.
      - name: Add the SBOMs to checksums.txt
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          cd dist
          for f in "dupearr_${version}_source" "dupearr_${version}_image_linux_amd64" "dupearr_${version}_image_linux_arm64"; do
            for ext in spdx.json cdx.json; do
              if [ ! -s "${f}.${ext}" ]; then
                echo "Missing SBOM ${f}.${ext}" >&2
                exit 1
              fi
            done
          done
          # The same command as make release, over the archives and the SBOMs.
          sha256sum dupearr_* > checksums.txt
          cat checksums.txt

      - name: Attest the archives and SBOMs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ needs.image.outputs.image }}
          VERSION: ${{ needs.image.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          # This version's CHANGELOG section ("## [X.Y.Z] ..." up to the next "## ["), if any.
          awk -v v="${tag#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > changes.md
          {
            echo "Container image (linux/amd64, linux/arm64): \`${IMAGE}:${VERSION}\`"
            echo
            echo "Pin exactly this image (Docker verifies every byte it pulls): \`${IMAGE}:${VERSION}@${DIGEST}\`"
            echo
            echo "Verify the build provenance: \`gh attestation verify oci://${IMAGE}:${VERSION} --owner ${OWNER}\` (image) and \`gh attestation verify <file> --owner ${OWNER}\` (archives and SBOMs). SHA-256 sums: \`checksums.txt\`."
            echo
            echo "SBOMs (SPDX 2.3 and CycloneDX 1.6 JSON): \`dupearr_${tag#v}_source.*.json\` (Go modules, the web UI's npm packages) and \`dupearr_${tag#v}_image_linux_{amd64,arm64}.*.json\` (each platform of the image above)."
            echo
            if [ -s changes.md ]; then cat changes.md; else echo "See [CHANGELOG.md](CHANGELOG.md)."; fi
          } > notes.md
          set --
          for f in dist/*.tar.gz dist/*.zip dist/*.spdx.json dist/*.cdx.json dist/checksums.txt; do
            if [ -f "$f" ]; then set -- "$@" "$f"; fi
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-run: replace the assets, keep the notes.
            gh release upload "$tag" "$@" --clobber
          else
            pre=""
            case "$tag" in *-*) pre="--prerelease" ;; esac
            # shellcheck disable=SC2086
            gh release create "$tag" "$@" --verify-tag --title "$tag" --notes-file notes.md $pre
          fi

  demo-media:
    name: demo media image
    # After the Dupearr image: deploy/demo pulls both images as :latest, so the demo image must never
    # move ahead of a Dupearr image that failed to publish. The release itself does not wait for it.
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Pull the Dupearr image just pushed (its package may still be private) for the demo test,
      # then push the demo image and its attestation to ghcr.io with GITHUB_TOKEN.
      packages: write
      id-token: write
      attestations: write
    env:
      DEMO_IMAGE_NAME: dupearr-demo-media
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same version and tag scheme as the Dupearr image (the demo pins both to one release).
      - name: Compute version, image and tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '$tag' is not a release version (vX.Y.Z or vX.Y.Z-pre.N)" >&2
            exit 1
          fi
          version="$(printf '%s' "${tag#v}" | tr '[:upper:]' '[:lower:]')"
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${DEMO_IMAGE_NAME}"
          tags="${image}:${version},${image}:v${version}"
          case "$version" in
            *-*) echo "Pre-release: not moving :latest or :X.Y" ;;
            *) tags="${tags},${image}:${version%.*},${image}:latest" ;;
          esac
          {
            echo "version=${version}"
            echo "image=${image}"
            echo "tags=${tags}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          } >> "$GITHUB_OUTPUT"
          echo "Will push: ${tags}"

      # The fake servers cross-compile; only the final alpine stage runs per architecture.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build context is filtered by docker/fakemedia.Dockerfile.dockerignore (an allowlist).
      - name: Build the demo image for the test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/fakemedia.Dockerfile
          push: false
          load: true
          tags: dupearr-demo-media:release-test
          provenance: false
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            SOURCE_URL=${{ steps.meta.outputs.source }}

      # The demo as users run it (deploy/demo/docker-compose.yml), with the Dupearr image this
      # release pushed, by digest: the seed must configure Dupearr, the scan must find the default
      # scenario's groups, and dry run, the recycle bin and restore must work (deploy/demo/test.sh).
      - name: Test the demo
        env:
          DEMO_DUPEARR_IMAGE: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          DEMO_MEDIA_IMAGE: dupearr-demo-media:release-test
        run: sh deploy/demo/test.sh

      - name: Build and push linux/amd64 + linux/arm64
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/fakemedia.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: |
            index:org.opencontainers.image.source=${{ steps.meta.outputs.source }}
            index:org.opencontainers.image.licenses=GPL-3.0-or-later
            index:org.opencontainers.image.description=FAKE Plex, Radarr and Sonarr servers with a made-up library of empty placeholder files, for the Dupearr demo (deploy/demo) and tests. No real media, no secrets. Not a media server.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            SOURCE_URL=${{ steps.meta.outputs.source }}

      - name: Check the pushed image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "The push reported no image digest ('$DIGEST')" >&2; exit 1 ;;
          esac
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" > index.json
          platforms="$(jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"' index.json | sort -u | tr '\n' ' ')"
          echo "Platforms: ${platforms}"
          for want in linux/amd64 linux/arm64; do
            case " ${platforms} " in
              *" ${want} "*) ;;
              *) echo "The pushed index has no ${want} image" >&2; exit 1 ;;
            esac
          done
          echo "Pushed ${IMAGE}:${VERSION}@${DIGEST}"
          echo "Demo image: \`${IMAGE}:${VERSION}@${DIGEST}\` (${platforms})" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Install cosign
        if: vars.COSIGN_SIGN == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: vars.COSIGN_SIGN == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
